image: node:22

stages:
  - verify
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

verify:
  stage: verify
  script:
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm test

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
